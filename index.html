<!DOCTYPE html>
<html lang="en">
<head>
<title>Tally Grades</title>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { if (localStorage.getItem('tg_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Dark is the default. Light is chosen with the switch in the footer and saved on this device. */
  :root {
    color-scheme: dark;
    --bg: #0F100E; --card: #171815; --card2: #20211D; --line: #2E302A; --text: #F2F3EC; --muted: #9C9E92; --dot: rgba(255,255,255,.055);
    --accent: #F23B3B; --on-accent: #FFFFFF; --ink: #FF6B61; --soft: rgba(242,59,59,.14); --focus: rgba(255,255,255,.09);
    --ok: #4ADE80; --ok-bg: rgba(74,222,128,.14); --warn: #FB923C; --warn-bg: rgba(251,146,60,.15); --err: #FF5A6E; --err-bg: rgba(255,90,110,.14);
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 18px 40px -24px rgba(0,0,0,.8);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
    /* older names, still used by a few inline styles */
    --purple: var(--accent); --purple2: var(--ink); --pill: var(--soft);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F4F2EC; --card: #FFFFFF; --card2: #F1EFE7; --line: #DEDACE; --text: #16170F; --muted: #6A6B60; --dot: rgba(0,0,0,.06);
    --accent: #DC2626; --on-accent: #FFFFFF; --ink: #B91C1C; --soft: rgba(220,38,38,.1); --focus: rgba(0,0,0,.07);
    --ok: #15803D; --ok-bg: rgba(21,128,61,.11); --warn: #C2410C; --warn-bg: rgba(194,65,12,.11); --err: #BE123C; --err-bg: rgba(190,18,60,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 18px 40px -26px rgba(40,40,20,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text); font-size: 16px; line-height: 1.45; background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
  a { color: var(--ink); }
  ::selection { background: var(--accent); color: var(--on-accent); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 40px 24px 24px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px 24px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--display); font-size: clamp(34px, 5vw, 58px); font-weight: 800; margin: 0; letter-spacing: -.035em; line-height: 1.02; }
  h1.brand { display: flex; align-items: center; gap: .28em; }
  h1.brand::before { content: ""; width: .62em; height: .62em; flex: none; border-radius: .14em; background:
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .14em 50% / .1em 52% no-repeat,
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .27em 50% / .1em 52% no-repeat,
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .40em 50% / .1em 52% no-repeat, var(--accent); }
  h2 { font-family: var(--display); letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 10px 0 0; font-size: 16px; max-width: 70ch; }
  .tabs { display: flex; gap: 4px 26px; flex-wrap: wrap; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 0 12px; margin-bottom: -1px; font-weight: 600; font-size: 15px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
  .grid > .card:not(.add):hover { border-color: var(--muted); transform: translateY(-2px); }
  .card h3 { font-family: var(--display); font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin: 14px 0 6px; line-height: 1.15; }
  .card p { color: var(--muted); margin: 0 0 14px; font-size: 15px; line-height: 1.5; }
  .pill { display: inline-block; background: var(--soft); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 4px 9px; }
  .pill.green { background: var(--ok-bg); color: var(--ok); margin-left: 6px; }
  .pill.green::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .links { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; }
  .link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .link.danger { color: var(--muted); }
  .link.danger:hover { color: var(--err); }
  .top .links .link { color: var(--text); opacity: .8; font-size: 14px; }
  .top .links .link:hover { opacity: 1; }
  .card[style*="--warn"] { border-color: var(--warn); }
  .card.add { border: 1.5px dashed var(--line); background: transparent; display: grid; place-items: center; align-content: center; gap: 10px; min-height: 190px; box-shadow: none; }
  .card.add:hover { border-color: var(--ink); }
  .card.add button { background: none; border: 0; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 20px; }

  /* landing: three rows, the whole row is the button */
  .doors { border-top: 2px solid var(--text); counter-reset: door; }
  .top:has(+ .doors) { border-bottom: 0; padding-bottom: 0; }
  .door { counter-increment: door; display: grid; grid-template-columns: 64px 1fr auto; grid-template-areas: "num title go" "num desc go"; gap: 6px 24px; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 30px 6px; color: inherit; transition: background .15s, padding .15s; }
  .door::before { content: "0" counter(door); grid-area: num; align-self: start; padding-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .door .pill { display: none; }
  .door-t { grid-area: title; font-family: var(--display); font-size: clamp(32px, 4.5vw, 52px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; transition: color .15s; }
  .door-d { grid-area: desc; color: var(--muted); font-size: 16px; max-width: 60ch; }
  .door-go { grid-area: go; font-size: 40px; color: var(--muted); transition: transform .2s, color .15s; }
  .door:hover { background: linear-gradient(90deg, var(--soft), transparent 70%); padding-left: 16px; }
  .door:hover .door-t, .door:hover .door-go { color: var(--ink); }
  .door:hover .door-go { transform: translateX(8px); }

  /* groups: one list per course */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
  .toolbar .filters { margin: 0; }
  .toolbar .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .course { margin-bottom: 40px; }
  .course-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: 10px; }
  .course-head h2 { margin: 0; font-size: 28px; font-weight: 800; }
  .course-head span { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .grow { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 6px 24px; align-items: center; padding: 18px 8px; border-bottom: 1px solid var(--line); transition: background .15s; }
  .grow:hover { background: linear-gradient(90deg, var(--soft), transparent 75%); }
  .gcode { font-family: var(--display); font-size: 44px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .grow.is-live .gcode { color: var(--ink); }
  .gta { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .gta.none { color: var(--muted); font-weight: 600; }
  .gta .pill.green { margin: 0; }
  .gmeta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .gbar { height: 4px; max-width: 260px; border-radius: 4px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .gbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .grow .links { margin: 0; justify-content: flex-end; }
  .grow .owner { color: var(--muted); font-size: 14px; }
  .empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 40px 20px; text-align: center; color: var(--muted); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); }
  .narrow { max-width: 460px; margin: 6vh auto 0; }
  .form { display: grid; gap: 16px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .row > label { flex: 1 1 160px; }
  label.f { display: grid; gap: 7px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  input.in, select.in, textarea.in { font-family: var(--font); font-size: 16px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--text);
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  input.in:focus, select.in:focus, textarea.in:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 4px var(--focus); }
  textarea.in { min-height: 170px; font-family: var(--mono); font-size: 13px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 17px; height: 17px; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: 15px; }
  .btn { background: var(--accent); color: var(--on-accent); border: 1px solid transparent; border-radius: 10px; padding: 12px 20px; font-weight: 700; transition: filter .15s, transform .05s; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--muted); filter: none; }
  .btn.danger { background: transparent; color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
  .note { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.55; }
  .err { color: var(--err); min-height: 20px; font-size: 14px; font-weight: 500; }
  .back { background: none; border: 0; color: var(--muted); font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 18px; }
  .back:hover { color: var(--text); }

  .overlay { position: fixed; inset: 0; background: rgba(5,5,4,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; z-index: 20; animation: fade .15s ease-out; }
  .overlay .panel { width: min(560px, 100%); max-height: 92vh; overflow: auto; animation: rise .18s ease-out; }
  .overlay .panel.wide { width: min(860px, 100%); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; max-height: 42vh; overflow: auto; padding: 2px; }
  .pick { display: flex; gap: 10px; align-items: flex-start; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .pick:has(input:checked) { border-color: var(--ink); background: var(--soft); }
  .pick b { color: var(--text); font-size: 15px; font-weight: 600; }
  .pick input { margin-top: 2px; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; margin: -6px 0 22px; }
  .filters .in { width: auto; min-width: 220px; }

  /* live check-in */
  .live { display: grid; grid-template-columns: minmax(260px, 420px) minmax(280px, 1fr) 280px; gap: 18px; align-items: start; }
  .qr { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 0 0 6px var(--accent); }
  .qr svg { width: 100%; height: auto; display: block; }
  .qr p { color: #16170F; text-align: center; font-family: var(--display); font-weight: 800; font-size: 22px; margin: 8px 0 0; letter-spacing: -.01em; }
  .codebox { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .codebox .lbl span + span { text-transform: none; letter-spacing: 0; }
  .codebox .lbl { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  .digits { font-family: var(--mono); font-weight: 800; font-size: clamp(64px, 9vw, 132px); letter-spacing: .12em; color: var(--ink); line-height: 1.05; margin-top: 8px; }
  .tally { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; font-size: 20px; margin-top: 22px; color: var(--muted); font-weight: 600; }
  .tally b { font-family: var(--display); font-size: clamp(54px, 6vw, 88px); color: var(--text); font-weight: 800; line-height: 1; letter-spacing: -.04em; }
  .left { color: var(--muted); margin-top: 8px; font-weight: 600; font-size: 15px; }
  .side h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .side ol, .side ul { list-style: none; margin: 0 0 22px; padding: 0; }
  .side li { padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
  .side li:first-child { animation: rise .3s ease-out; }
  .flags li { color: var(--warn); font-size: 14px; }
  .random { margin-bottom: 18px; border-color: var(--warn); }
  .random .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; font-weight: 700; font-size: 17px; }
  body.projector .hide-proj { display: none !important; }
  body.projector .wrap { max-width: none; }

  /* tables */
  .stats { display: flex; gap: 10px 28px; flex-wrap: wrap; margin: 18px 0 14px; color: var(--muted); font-weight: 600; font-size: 14px; }
  .stats b { font-family: var(--display); color: var(--text); font-size: 30px; font-weight: 800; margin-right: 6px; letter-spacing: -.02em; }
  .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td:nth-child(2) { white-space: normal; min-width: 200px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--card2); }
  th { color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; background: var(--card2); }
  td.mono { font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .chip { min-width: 108px; border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
  .chip.P { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .chip.A { background: var(--err-bg); color: var(--err); border-color: transparent; }
  .chip.E { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .cell { width: 74px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; text-align: center; font-family: var(--mono); font-size: 14px; color: var(--text); }
  .cell:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 3px var(--focus); }
  .cell.dirty { border-color: var(--warn); background: var(--warn-bg); }
  .cell.bad { border-color: var(--err); color: var(--err); background: var(--err-bg); }
  th small { display: block; font-weight: 500; opacity: .8; text-transform: none; }
  .total { font-family: var(--mono); font-weight: 800; color: var(--text); }
  .item-row { display: grid; grid-template-columns: 1fr 110px 42px; gap: 10px; align-items: center; }
  .x { background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--err); height: 46px; font-size: 20px; }

  /* student phone */
  .stu { max-width: 460px; margin: 4vh auto 0; }
  .big-in { font-family: var(--mono) !important; font-size: 32px !important; font-weight: 800 !important; letter-spacing: .08em !important; text-align: center; padding: 16px !important; }
  .done { text-align: center; padding: 10px 0 4px; }
  .done .mark { width: 96px; height: 96px; border-radius: 28px; margin: 6px auto 18px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 52px; font-weight: 900; transform: rotate(-6deg); animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: rotate(-6deg) scale(.4); opacity: 0; } }
  .done h2 { font-family: var(--display); font-size: 36px; margin: 0; font-weight: 800; letter-spacing: -.03em; }
  .done .name { font-size: 20px; font-weight: 700; margin-top: 10px; }
  .msg { margin-top: 14px; border-radius: 10px; padding: 12px 16px; font-weight: 700; border-left: 4px solid currentColor; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg small { display: block; font-weight: 500; margin-top: 4px; color: var(--text); opacity: .85; }

  .foot { text-align: center; color: var(--muted); padding: 48px 16px 30px; font-size: 14px; line-height: 1.9; }
  .foot .by { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--text); }
  .theme { margin-top: 10px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; }
  .theme:hover { color: var(--text); border-color: var(--muted); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 12px; z-index: 40; max-width: 92vw; font-weight: 600; font-size: 15px; box-shadow: 0 16px 40px rgba(0,0,0,.35); animation: rise .2s ease-out; }
  .toast a { color: inherit; text-decoration: underline; }
  .loading { text-align: center; color: var(--muted); padding: 18vh 0; font-family: var(--mono); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  .loading::after { content: ""; display: block; width: 36px; height: 4px; margin: 14px auto 0; border-radius: 4px; background: var(--accent); animation: pulse 1s infinite; }
  @media (max-width: 1100px) { .live { grid-template-columns: 1fr 1fr; } .live .side { grid-column: 1 / -1; } }
  @media (max-width: 700px) { .live { grid-template-columns: 1fr; } .wrap { padding: 24px 16px 16px; } .panel { padding: 22px; }
    .grow { grid-template-columns: 72px minmax(0, 1fr); } .gcode { font-size: 34px; } .grow .links, .grow .owner { grid-column: 1 / -1; justify-content: flex-start; } .toolbar .filters .in { flex: 1 1 100%; }
    .door { grid-template-columns: 36px 1fr; grid-template-areas: "num title" "num desc"; padding: 24px 4px; } .door-go { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading</div></div>
<footer class="foot"><div>Tally Grades &middot; Attendance and grades &middot; 2026-2027</div><div class="by">Made By: Toqa Hamdy</div><button class="theme" id="themeBtn" type="button"></button></footer>
<script>
(function () {
  const root = document.documentElement, btn = document.getElementById('themeBtn');
  const paint = () => { btn.textContent = root.dataset.theme === 'light' ? 'Dark mode' : 'Light mode'; };
  btn.onclick = () => {
    const light = root.dataset.theme !== 'light';
    if (light) root.dataset.theme = 'light'; else delete root.dataset.theme;
    try { localStorage.setItem('tg_theme', light ? 'light' : 'dark'); } catch (e) {}
    paint();
  };
  paint();
})();
</script>
<div class="toast" id="toast" hidden></div>

  /**

  /** End of term: one Excel file, one tab per course, one row per student with every week, attendance %, every grade and the total. */
  async function downloadFinal() {
    toast('Preparing the file');
    try {
      await loadXlsx();
      const data = await api('finalExport', PIN);
      if (!data.length) return toast('No students to export yet.');
      const wb = XLSX.utils.book_new(), used = {};
      data.forEach(c => {
        const head = ['Group', 'TA', 'Student Name', 'ID'].concat(c.weeks, ['Present', 'Absent', 'Excused', 'Attendance %'],
          c.attendanceMax ? ['Attendance (' + c.attendanceMax + ')'] : [], c.items.map(it => it.item + ' (' + it.max + ')'), ['Total']);
        const rows = c.rows.map(r => [r.group, r.ta, r.name, Number(r.id)].concat(r.weeks, [r.p, r.a, r.e, r.pct],
          c.attendanceMax ? [r.attGrade] : [], c.items.map(it => r.scores[it.key] === undefined ? '' : r.scores[it.key]), [r.total]));
        const ws = XLSX.utils.aoa_to_sheet([head].concat(rows));
        const pctCol = 4 + c.weeks.length + 3;
        for (let i = 1; i <= rows.length; i++) { const cell = ws[XLSX.utils.encode_cell({ r: i, c: pctCol })]; if (cell && cell.t === 'n') cell.z = '0%'; }
        ws['!cols'] = head.map((h, i) => ({ wch: i === 2 ? 42 : i === 3 ? 12 : Math.max(7, String(h).length + 2) }));
        let name = c.course.replace(/[\[\]*?\/\\:]/g, ' ').trim().slice(0, 31) || 'Course', k = 2;
        while (used[name]) name = name.slice(0, 27) + ' (' + (k++) + ')';
        used[name] = true;
        XLSX.utils.book_append_sheet(wb, ws, name);
      });
      XLSX.writeFile(wb, 'Tally Grades - Final attendance and grades.xlsx');
      toast('Downloaded: Tally Grades - Final attendance and grades.xlsx');
    } catch (e) { toast(errMsg(e)); }
  }
  /** Admin: every table in one Excel file (PINs are never included). */

      Object.keys(data).forEach(k => {
        const rows = data[k] || [];
        const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['No data yet']]);
        XLSX.utils.book_append_sheet(wb, ws, k);
      });
      XLSX.writeFile(wb, 'Tally Grades - Backup ' + new Date().toISOString().slice(0, 10) + '.xlsx');
      toast('Backup downloaded.');
    } catch (e) { toast(errMsg(e)); }
  }

  function parseList(text) {
    const out = [], seen = {};
    for (const line of String(text).split(/\r?\n/)) {
      if (!line.trim()) continue;
      let cells = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/[,;]/)).map(x => x.trim()).filter(Boolean);
      let id = '', name = '';
      if (cells.length === 1) {
        const m = cells[0].match(/^(.*?)[\s\-:]+(\d{4,})$/) || cells[0].match(/^(\d{4,})[\s\-:]+(.*)$/);
        if (m) { if (/^\d+$/.test(m[1])) { id = m[1]; name = m[2]; } else { name = m[1]; id = m[2]; } }
      } else {
        const idCell = cells.find(x => /^\d{4,}(\.0+)?$/.test(x.replace(/\s/g, '')));
        if (idCell) {
          id = idCell.replace(/\s/g, '').replace(/\.0+$/, '');
          name = cells.filter(x => x !== idCell && !/^\d+$/.test(x)).sort((a, b) => b.length - a.length)[0] || '';
        }
      }
      if (id && name && !seen[id]) { seen[id] = 1; out.push([name.replace(/\s+/g, ' ').trim(), id]); }
    }
    return out;
  }

  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script'); sc.src = XLSX_URL;
      sc.onload = resolve; sc.onerror = () => reject(new Error('Could not load the Excel reader. Check your internet and try again.'));
      document.head.appendChild(sc);

  function courseFromFile(name) {
    return name.replace(/\.(xlsx|xlsm|xls|csv)$/i, '')
      .replace(/__([A-Za-z]{2,5}\d{3,5})_?$/, ' ($1)')
      .replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  }
  /** Each tab can hold several groups: a row like "A3 - Toqa" (no ID) starts a group, rows with an ID are its students. */
  function parseWorkbook(wb) {
    const found = [];
    for (const sheetName of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: '' });
      let nameCol = 0, idCol = 1;
      for (let r = 0; r < Math.min(3, rows.length); r++) (rows[r] || []).forEach((v, c) => {
        const t = String(v).trim().toLowerCase();
        if (t === 'name' || t === 'student name') nameCol = c;
        if (t === 'id' || t === 'student id') idCol = c;
      });
      let cur = null;
      for (const row of rows) {
        const nm = String(row[nameCol] == null ? '' : row[nameCol]).replace(/\s+/g, ' ').trim();
        let idv = row[idCol];
        idv = typeof idv === 'number' ? String(Math.round(idv)) : String(idv == null ? '' : idv).trim().replace(/\.0+$/, '');
        if (!nm) continue;
        if (/^\d{6,12}$/.test(idv)) {
          if (!cur) { cur = { group: sheetName.trim(), ta: '', students: [] }; found.push(cur); }
          cur.students.push([nm, idv]); continue;
        }
        if (!idv) {
          const m = nm.match(/^([A-Za-z]{1,3}\s?\d{1,3})\s*(?:[-\u2013\u2014:]\s*(.*))?$/);
          if (m) { cur = { group: m[1].replace(/\s/g, '').toUpperCase(), ta: (m[2] || '').trim(), students: [] }; found.push(cur); }
        }
      }
    }
    const byName = {}, out = [];
    found.forEach(g => {
      if (!g.students.length) return;
      if (byName[g.group]) byName[g.group].students.push(...g.students);
      else { byName[g.group] = g; out.push(g); }
    });
    return out.sort((a, b) => numeric(a.group, b.group));
  }

        $('open').disabled = true;
        try { await api('openSession', PIN, g.course, g.group, week, Number($('mn').value), $('stc').checked, $('gst').checked); await load(); }
        catch (e) { toast(errMsg(e)); $('open').disabled = false; }
      };
    }
    function renderLive() {
      const box = $('livebox');
      if (!(L && L.open && L.week === week)) { box.innerHTML = ''; lastQr = ''; document.body.classList.remove('projector'); return; }
      if (!$('qrsvg')) {
        box.innerHTML = '<div class="links hide-proj" style="margin:0 0 16px"><button class="link" id="rnd">Random check</button><button class="link" id="ext">+5 minutes</button>' +
          '<button class="link" id="prj">Projector view</button><button class="link danger" id="cls">Close check-in</button></div>' +
          '<div class="live"><div class="qr"><div id="qrsvg"></div><p>Scan to check in</p></div>' +
          '<div class="card"><div class="codebox"><div class="lbl"><span>' + esc(L.weekLabel) + ' code</span><span id="ctm"></span></div><div class="digits" id="dg"></div></div>' +
          '<div class="tally"><b id="cn">0</b><span>of</span><b id="tt">0</b><span>checked in</span></div><div class="left" id="gs"></div><div class="left" id="lf"></div></div>' +
          '<div class="side"><div class="card random" id="rb" hidden></div><h2>Just checked in</h2><ol id="rc"></ol><div id="gl"></div></div></div>' +
          '<button class="link" id="prjx" type="button" style="margin-top:18px" hidden>Exit projector view</button>';
        const proj = (on) => {
          document.body.classList.toggle('projector', on); $('prjx').hidden = !on;
          if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
          if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
        };
        $('prj').onclick = () => proj(true);
        $('prjx').onclick = () => proj(false);
        $('ext').onclick = async () => { try { await api('extendSession', PIN, L.id, 5); toast('Added 5 minutes.'); refresh(); } catch (e) { toast(errMsg(e)); } };
        $('cls').onclick = async () => {
          if (!confirm('Close check-in now? Students who did not check in will be absent.')) return;
          try { await api('closeSession', PIN, L.id); toast('Check-in closed.'); load(); } catch (e) { toast(errMsg(e)); }
        };
        $('rnd').onclick = async () => {
          try {
            const picks = await api('randomCheck', PIN, L.id, 3);
            const rb = $('rb'); rb.hidden = false;
            rb.innerHTML = '<h2>' + (picks.length ? 'Random check: are they here?' : 'Nobody checked in yet.') + '</h2>' + picks.map((p, i) => '<div class="item"><span>' + esc(p.name) + '</span><button class="btn danger" data-ab="' + i + '" type="button">Not here</button></div>').join('');
            rb.querySelectorAll('[data-ab]').forEach(b => b.onclick = async () => {
              b.disabled = true;
              try { await api('mark', PIN, g.course, g.group, L.week, picks[b.dataset.ab].id, 'A'); b.textContent = 'Marked absent'; refresh(); } catch (e) { toast(errMsg(e)); b.disabled = false; }
            });
          } catch (e) { toast(errMsg(e)); }
        };
      }
      $('dg').textContent = L.code;
      const url = SITE + '?s=' + L.id + '&c=' + L.code;
      if (url !== lastQr) { lastQr = url; const qq = qrcode(0, 'M'); qq.addData(url); qq.make(); $('qrsvg').innerHTML = qq.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); }
      $('cn').textContent = L.count; $('tt').textContent = L.total;
      $('gs').textContent = L.guests ? '+ ' + L.guests + ' from other groups (counted in their own groups)' : (L.guestsAllowed === false ? '' : '');
      $('gl').innerHTML = L.guests ? '<h2>From other groups</h2><ol>' + L.guestNames.map(n => '<li>' + esc(n) + '</li>').join('') + '</ol>' : '';
      $('rc').innerHTML = L.recent.length ? L.recent.map(n => '<li>' + esc(n) + '</li>').join('') : '<li style="color:var(--muted)">Waiting for students</li>';
      left = L.secondsLeft; codeLeft = L.codeLeft; paintTimers();
    }
    function paintTimers() {
      if (!$('lf')) return;
      $('lf').textContent = 'Closes in ' + mmss(left);
      $('ctm').textContent = L.strict ? 'changes in ' + codeLeft + 's' : 'same code for this session';
    }
    function renderList() {
      if (M) {
        $('stt').innerHTML = '<span>P = present, A = absent, E = excused, empty = no check-in that week.</span>';
        $('th').innerHTML = '<tr><th>#</th><th>Student Name</th><th>ID</th>' + M.weeks.map(w => '<th>' + esc(w) + '</th>').join('') + '<th>Present</th><th>Absent</th><th>%</th></tr>';
        $('rows').innerHTML = M.rows.map((r, i) => (q && r.name.toLowerCase().indexOf(q) < 0 && r.id.indexOf(q) < 0) ? '' :
          '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="mono">' + esc(r.id) + '</td>' +
          r.weeks.map(v => '<td>' + (v ? '<span class="chip ' + v + '" style="min-width:0;padding:3px 9px">' + v + '</span>' : '') + '</td>').join('') +
          '<td>' + r.p + '</td><td>' + r.a + '</td><td><b>' + (r.pct === '' ? '' : Math.round(r.pct * 100) + '%') + '</b></td></tr>').join('');
        $('fl').innerHTML = '<li>Choose a single week to see flags.</li>';
        return;
      }
      if (!W) return;
      const live = L && L.open && L.week === W.week;
      const waiting = (r) => live && r.status === 'A' && !r.method;
      $('stt').innerHTML = live ? '<span><b>' + W.present + '</b>present</span><span><b>' + W.rows.filter(waiting).length + '</b>not checked in yet</span>' : W.held ? '<span><b>' + W.present + '</b>present</span><span><b>' + W.absent + '</b>absent</span><span><b>' + W.excused + '</b>excused</span>'
        : '<span>' + esc(W.weekLabel) + ': no check-in yet.</span>';
      $('th').innerHTML = '<tr><th>#</th><th>Student Name</th><th>ID</th><th>Time</th><th>How</th><th>Status</th></tr>';
      $('rows').innerHTML = W.rows.map((r, i) => (q && r.name.toLowerCase().indexOf(q) < 0 && r.id.indexOf(q) < 0) ? '' :
        '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="mono">' + esc(r.id) + '</td><td>' + esc(r.time) + '</td><td>' + esc(r.method) + '</td>' +
        '<td><button type="button" class="chip ' + (waiting(r) ? '' : r.status) + '" data-i="' + i + '">' + (waiting(r) ? 'Not yet' : ({ P: 'Present', A: 'Absent', E: 'Excused' }[r.status] || 'Not marked')) + '</button></td></tr>').join('');
      $('rows').querySelectorAll('[data-i]').forEach(b => b.onclick = async () => {
        const r = W.rows[b.dataset.i];
        b.disabled = true;
        try { W = await api('mark', PIN, W.course, W.group, W.week, r.id, { A: 'P', '': 'P', P: 'E', E: 'A' }[r.status]); renderList(); if (L && L.open) refresh(); }
        catch (e) { toast(errMsg(e)); b.disabled = false; }
      });
      $('fl').innerHTML = W.flags.length ? W.flags.map(f => '<li>' + esc(f) + '</li>').join('') : '<li>None</li>';
    }
    load();
  }

  /* ----- grades ----- */
  async function copyText(text, msg) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove();
    }
    toast(ok ? msg : 'Could not copy. Try again.');
  }
  async function gradesPage(g) {
    stopTimers();
    let V = null; const dirty = {};
    app.innerHTML = '<div class="wrap"><button class="back" id="bk" type="button">&larr; Groups</button>' +
      '<div class="top"><div><span class="pill">Group ' + esc(g.group) + '</span><h1 style="margin-top:12px">' + esc(g.course) + '</h1><p class="sub">Grades. Type the marks, then press Save.</p></div>' +
      '<div class="links" style="margin:0"><button class="link" id="items" hidden>Grade items</button><button class="link" id="cpsec">Copy section attendance (W1 to W12)</button><button class="link" id="cpgr">Copy grades</button><button class="link" id="cpall">Copy all</button></div></div>' +
      '<div class="panel" style="padding:16px 20px;margin-bottom:16px"><div class="row" style="align-items:center"><input class="in" id="sr" type="search" placeholder="Search a name or ID" style="max-width:320px">' +
      '<button class="btn" id="save" type="button" disabled>Save</button><span class="note" id="st"></span></div></div>' +
      '<div class="table-wrap"><table><thead id="th"></thead><tbody id="rows"><tr><td style="color:var(--muted)">Loading</td></tr></tbody></table></div>' +
      '<p class="note" style="margin-top:14px">Copy section attendance gives 1 for present (or excused) and 0 for absent, in the order of the course sheet: weeks 1 to 6 and 8 to 13 become W1 to W12. Paste it on the first student\'s W1 cell.</p></div>';
    const unsaved = () => Object.keys(dirty).length;
    $('bk').onclick = async () => {
      if (unsaved() && !confirm('You have marks that are not saved. Leave anyway?')) return;
      try { D = await api('whoami', PIN); } catch (e) {} dashboard();
    };
    $('sr').oninput = () => {
      const q = $('sr').value.trim().toLowerCase();
      $('rows').querySelectorAll('tr[data-q]').forEach(tr => { tr.hidden = q && tr.dataset.q.indexOf(q) < 0; });
    };
    const fmtPct = (x) => x === '' ? '' : Math.round(x * 100) + '%';
    function render() {
      $('items').hidden = !V.canEditItems;
      if (!V.items.length && !V.attendanceMax) {
        $('th').innerHTML = '';
        $('rows').innerHTML = '<tr><td style="padding:22px">' + (V.canEditItems ? 'No grade items yet. Press <b>Grade items</b> to add the quizzes, assignments and midterm of this course.' : 'No grade items yet. The admin adds the quizzes and assignments of this course.') + '</td></tr>';
        return;
      }
      $('th').innerHTML = '<tr><th>#</th><th>Student Name</th><th>ID</th><th>Attendance</th>' + (V.attendanceMax ? '<th>Attendance<small>/' + V.attendanceMax + '</small></th>' : '') +
        V.items.map(it => '<th>' + esc(it.item) + '<small>/' + it.max + '</small></th>').join('') + '<th>Total</th></tr>';
      $('rows').innerHTML = V.rows.map((r, i) => '<tr data-q="' + esc((r.name + ' ' + r.id).toLowerCase()) + '"><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="mono">' + esc(r.id) + '</td>' +
        '<td>' + fmtPct(r.pct) + '</td>' + (V.attendanceMax ? '<td>' + (r.attGrade === '' ? '' : r.attGrade) + '</td>' : '') +
        V.items.map(it => { const k = r.id + '|' + it.key; const v = k in dirty ? dirty[k] : (r.scores[it.key] === undefined ? '' : r.scores[it.key]);
          return '<td><input class="cell' + (k in dirty ? ' dirty' : '') + '" inputmode="decimal" data-i="' + i + '" data-k="' + esc(it.key) + '" data-max="' + it.max + '" value="' + esc(v) + '"></td>'; }).join('') +
        '<td class="total" id="tot' + i + '">' + r.total + '</td></tr>').join('');
      $('rows').querySelectorAll('.cell').forEach(inp => inp.oninput = () => {
        const r = V.rows[inp.dataset.i], k = r.id + '|' + inp.dataset.k, raw = inp.value.trim().replace(',', '.');
        const orig = r.scores[inp.dataset.k] === undefined ? '' : String(r.scores[inp.dataset.k]);
        const n = Number(raw), bad = raw !== '' && (isNaN(n) || n < 0 || n > Number(inp.dataset.max));
        inp.classList.toggle('bad', bad);
        if (raw === orig) delete dirty[k]; else dirty[k] = raw;
        inp.classList.toggle('dirty', k in dirty);
        let sum = r.attGrade || 0;
        V.items.forEach(it => { const kk = r.id + '|' + it.key; const v = kk in dirty ? Number(dirty[kk]) : r.scores[it.key]; if (v !== undefined && v !== '' && !isNaN(v)) sum += Number(v); });
        $('tot' + inp.dataset.i).textContent = Math.round(sum * 100) / 100;
        $('save').disabled = !unsaved() || !!$('rows').querySelector('.cell.bad');
        $('st').textContent = unsaved() ? unsaved() + ' marks not saved' : '';
      });
      $('save').disabled = true; $('st').textContent = '';
    }
    async function load() {
      try { V = await api('gradesView', PIN, g.course, g.group); render(); } catch (e) { toast(errMsg(e)); }
    }
    $('save').onclick = async () => {
      const changes = Object.keys(dirty).map(k => { const [id, key] = k.split('|'); return { id: id, key: key, score: dirty[k] }; });
      $('save').disabled = true; $('save').textContent = 'Saving';
      try { V = await api('saveScores', PIN, g.course, g.group, changes); Object.keys(dirty).forEach(k => delete dirty[k]); render(); toast('Saved.'); }
      catch (e) { toast(errMsg(e)); $('save').disabled = false; }
      $('save').textContent = 'Save';
    };
    $('items').onclick = () => itemsDialog(g.course, V, load);
    $('cpsec').onclick = () => { if (V) copyText(V.rows.map(r => r.section.join('\t')).join('\n'), 'Copied. Paste it on the first student\'s W1 cell in the course sheet.'); };
    $('cpgr').onclick = () => { if (V) copyText(V.rows.map(r => V.items.map(it => r.scores[it.key] === undefined ? '' : r.scores[it.key]).join('\t')).join('\n'), 'Copied the grade columns, in the same student order.'); };
    $('cpall').onclick = () => {
      if (!V) return;
      const head = ['Student Name', 'ID', 'Attendance %'].concat(V.attendanceMax ? ['Attendance /' + V.attendanceMax] : [], V.items.map(it => it.item + ' /' + it.max), ['Total']);
      const lines = [head.join('\t')].concat(V.rows.map(r => [r.name, r.id, fmtPct(r.pct)].concat(V.attendanceMax ? [r.attGrade] : [], V.items.map(it => r.scores[it.key] === undefined ? '' : r.scores[it.key]), [r.total]).join('\t')));
      copyText(lines.join('\n'), 'Copied the whole table. Paste it in Excel or Google Sheets.');
    };
    load();
  }
  function itemsDialog(course, V, reload) {
    let rows = V.items.map(it => ({ key: it.key, item: it.item, max: it.max }));
    dialog('<span class="pill">' + esc(course) + '</span><h1 style="font-size:26px;margin-top:12px">Grade items</h1>' +
      '<p class="sub">These are the same for every group of this course. Renaming an item keeps its marks.</p>' +
      '<div class="form" style="margin-top:18px"><label class="f">Attendance is worth (marks, 0 for none)<input class="in" id="am" type="number" min="0" step="0.5" value="' + (V.attendanceMax || 0) + '"></label>' +
      '<div class="note">Items, in the same order as the course sheet</div><div id="list" class="form" style="gap:10px"></div>' +
      '<div class="links" style="margin:0"><button class="link" id="aq" type="button">+ Quiz</button><button class="link" id="aa" type="button">+ Assignment</button><button class="link" id="amid" type="button">+ Midterm</button><button class="link" id="ao" type="button">+ Other</button></div>' +
      '<div class="err" id="er"></div><div class="row"><button class="btn" id="go" type="button">Save</button><button class="btn ghost" data-close type="button">Cancel</button></div></div>',
      (o, close) => {
        const q = (x) => o.querySelector(x);
        const sync = () => o.querySelectorAll('.item-row').forEach((el, i) => { rows[i].item = el.querySelector('.nm').value; rows[i].max = el.querySelector('.mx').value; });
        const draw = () => {
          q('#list').innerHTML = rows.length ? rows.map((r, i) => '<div class="item-row"><input class="in nm" placeholder="Name" value="' + esc(r.item) + '"><input class="in mx" type="number" min="0" step="0.5" placeholder="Full mark" value="' + esc(r.max) + '"><button class="x" data-rm="' + i + '" type="button" aria-label="Remove">&times;</button></div>').join('') : '<p class="note">No items yet.</p>';
          o.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); rows.splice(Number(b.dataset.rm), 1); draw(); });
        };
        const add = (name, max) => { sync(); rows.push({ key: '', item: name, max: max }); draw(); const ins = o.querySelectorAll('.nm'); ins[ins.length - 1].focus(); };
        const count = (re) => rows.filter(r => re.test(r.item)).length;
        q('#aq').onclick = () => add('Q' + (count(/^Q\d+$/i) + 1), '');
        q('#aa').onclick = () => add('Sheet ' + (count(/^Sheet \d+$/i) + 1), '');
        q('#amid').onclick = () => add('Midterm', '');
        q('#ao').onclick = () => add('', '');
        draw();
        q('#go').onclick = async () => {
          sync(); q('#er').textContent = '';
          try { await api('saveItems', PIN, course, Number(q('#am').value), rows); close(); toast('Grade items saved.'); reload(); }
          catch (e) { q('#er').textContent = errMsg(e); }
        };
      });
  }

  startStaff();
})();
</script>
</body>
</html>
