<!DOCTYPE html>
<html lang="en">
<head>
<title>Tally Grades</title>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { if (localStorage.getItem('tg_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Dark is the default. Light is chosen with the switch in the footer and saved on this device. */
  :root {
    color-scheme: dark;
    --bg: #0F100E; --card: #171815; --card2: #20211D; --line: #2E302A; --text: #F2F3EC; --muted: #9C9E92; --dot: rgba(255,255,255,.055);
    --accent: #F23B3B; --on-accent: #FFFFFF; --ink: #FF6B61; --soft: rgba(242,59,59,.14); --focus: rgba(255,255,255,.09);
    --ok: #4ADE80; --ok-bg: rgba(74,222,128,.14); --warn: #FB923C; --warn-bg: rgba(251,146,60,.15); --err: #FF5A6E; --err-bg: rgba(255,90,110,.14);
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 18px 40px -24px rgba(0,0,0,.8);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
    /* older names, still used by a few inline styles */
    --purple: var(--accent); --purple2: var(--ink); --pill: var(--soft);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F4F2EC; --card: #FFFFFF; --card2: #F1EFE7; --line: #DEDACE; --text: #16170F; --muted: #6A6B60; --dot: rgba(0,0,0,.06);
    --accent: #DC2626; --on-accent: #FFFFFF; --ink: #B91C1C; --soft: rgba(220,38,38,.1); --focus: rgba(0,0,0,.07);
    --ok: #15803D; --ok-bg: rgba(21,128,61,.11); --warn: #C2410C; --warn-bg: rgba(194,65,12,.11); --err: #BE123C; --err-bg: rgba(190,18,60,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 18px 40px -26px rgba(40,40,20,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text); font-size: 16px; line-height: 1.45; background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
  a { color: var(--ink); }
  ::selection { background: var(--accent); color: var(--on-accent); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 40px 24px 24px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px 24px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--display); font-size: clamp(34px, 5vw, 58px); font-weight: 800; margin: 0; letter-spacing: -.035em; line-height: 1.02; }
  h1.brand { display: flex; align-items: center; gap: .28em; }
  h1.brand::before { content: ""; width: .62em; height: .62em; flex: none; border-radius: .14em; background:
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .14em 50% / .1em 52% no-repeat,
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .27em 50% / .1em 52% no-repeat,
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .40em 50% / .1em 52% no-repeat, var(--accent); }
  h2 { font-family: var(--display); letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 10px 0 0; font-size: 16px; max-width: 70ch; }
  .tabs { display: flex; gap: 4px 26px; flex-wrap: wrap; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 0 12px; margin-bottom: -1px; font-weight: 600; font-size: 15px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
  .grid > .card:not(.add):hover { border-color: var(--muted); transform: translateY(-2px); }
  .card h3 { font-family: var(--display); font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin: 14px 0 6px; line-height: 1.15; }
  .card p { color: var(--muted); margin: 0 0 14px; font-size: 15px; line-height: 1.5; }
  .pill { display: inline-block; background: var(--soft); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 4px 9px; }
  .pill.green { background: var(--ok-bg); color: var(--ok); margin-left: 6px; }
  .pill.green::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .links { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; }
  .link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .link.danger { color: var(--muted); }
  .link.danger:hover { color: var(--err); }
  .top .links .link { color: var(--text); opacity: .8; font-size: 14px; }
  .top .links .link:hover { opacity: 1; }
  .card[style*="--warn"] { border-color: var(--warn); }
  .card.add { border: 1.5px dashed var(--line); background: transparent; display: grid; place-items: center; align-content: center; gap: 10px; min-height: 190px; box-shadow: none; }
  .card.add:hover { border-color: var(--ink); }
  .card.add button { background: none; border: 0; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 20px; }

  /* landing: three rows, the whole row is the button */
  .doors { border-top: 2px solid var(--text); counter-reset: door; }
  .top:has(+ .doors) { border-bottom: 0; padding-bottom: 0; }
  .door { counter-increment: door; display: grid; grid-template-columns: 64px 1fr auto; grid-template-areas: "num title go" "num desc go"; gap: 6px 24px; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 30px 6px; color: inherit; transition: background .15s, padding .15s; }
  .door::before { content: "0" counter(door); grid-area: num; align-self: start; padding-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .door .pill { display: none; }
  .door-t { grid-area: title; font-family: var(--display); font-size: clamp(32px, 4.5vw, 52px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; transition: color .15s; }
  .door-d { grid-area: desc; color: var(--muted); font-size: 16px; max-width: 60ch; }
  .door-go { grid-area: go; font-size: 40px; color: var(--muted); transition: transform .2s, color .15s; }
  .door:hover { background: linear-gradient(90deg, var(--soft), transparent 70%); padding-left: 16px; }
  .door:hover .door-t, .door:hover .door-go { color: var(--ink); }
  .door:hover .door-go { transform: translateX(8px); }

  /* groups: one list per course */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
  .toolbar .filters { margin: 0; }
  .toolbar .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .course { margin-bottom: 40px; }
  .course-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: 10px; }
  .course-head h2 { margin: 0; font-size: 28px; font-weight: 800; }
  .course-head span { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; margin-top: 18px; }
  .letter { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 18px 8px; box-shadow: var(--shadow); align-self: start; }
  .letter-head { display: flex; align-items: center; gap: 14px; padding: 12px 0 14px; border-bottom: 2px solid var(--accent); }
  .letter-big { width: 54px; height: 54px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--accent); color: var(--on-accent);
    font-family: var(--display); font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
  .letter-meta { font-family: var(--mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); line-height: 1.6; }
  .grow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .grow:last-child { border-bottom: 0; }
  .gcode { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .grow.is-live .gcode { color: var(--ink); }
  .gta { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gta.none { color: var(--muted); font-weight: 600; }
  .gta .pill.green { margin: 0; }
  .gmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .gbar { height: 3px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .gbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .grow .links, .grow .owner { grid-column: 2; margin: 6px 0 0; gap: 4px 12px; }
  .grow .link { font-size: 13px; white-space: nowrap; }
  .grow .owner { color: var(--muted); font-size: 13px; }
  .cset .dbar { display: flex; gap: 3px; height: 10px; margin: 18px 0 14px; border-radius: 6px; overflow: hidden; }
  .cset .dbar i { display: block; min-width: 6px; }
  .d0 { background: var(--accent); } .d1 { background: var(--warn); } .d2 { background: var(--ok); } .d3 { background: var(--muted); }
  .dist { display: flex; flex-wrap: wrap; gap: 10px; }
  .dchip { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 150px; }
  .dchip .dot { width: 10px; height: 10px; border-radius: 3px; grid-row: span 2; }
  .dchip b { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .dchip span:last-child { color: var(--muted); font-weight: 600; font-size: 14px; }
  .dchip small { display: block; font-size: 12px; font-weight: 500; }
  .dist-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-weight: 600; }
  .dist-foot b { font-family: var(--display); font-size: 24px; color: var(--text); margin-left: 6px; }
  .together { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; margin-top: 4px; border-top: 1px dashed var(--line); }
  .together > span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .together small { flex: 1 1 100%; color: var(--muted); font-size: 13px; }
  .tg-pick { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; background: var(--card2); }
  .tg-pick:has(input:checked) { border-color: var(--ink); background: var(--soft); }
  .tg-pick b { font-family: var(--display); font-size: 17px; }
  .obar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 22px; }
  .obar > span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .ochip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); text-decoration: none; max-width: 260px; }
  .ochip:hover { border-color: var(--muted); }
  .ochip.on { border-color: var(--ink); background: var(--soft); padding-right: 12px; }
  .ochip b { font-family: var(--display); font-size: 16px; }
  .ochip small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .odot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; animation: pulse 1.6s infinite; }
  .ox { background: none; border: 0; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 2px; }
  .ox:hover { color: var(--err); }
  a.link { cursor: pointer; }
  .newtab { font-size: 16px !important; padding: 0 2px !important; color: var(--muted) !important; }
  .newtab:hover { color: var(--ink) !important; text-decoration: none !important; }
  .tmchip { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 1px 7px; border-radius: 6px; font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, transparent); vertical-align: 1px; white-space: nowrap; }
  .tmchip small { font-family: var(--font); font-weight: 600; font-size: 11px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .letter.team .letter-head { border-bottom-color: var(--tc); }
  .letter.team .letter-big, .gbadge.team-badge { background: var(--tc); color: #fff; }
  .team-name { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; margin-bottom: 4px; }
  .teamrow td { background: color-mix(in srgb, var(--tc, var(--accent)) 10%, var(--card)) !important; }
  .teamrow .stn { color: var(--tc, var(--ink)); }
  .gtable tr.leader td { background: color-mix(in srgb, var(--tc, var(--accent)) 5%, var(--card)); }
  .lead { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; background: var(--tc, var(--accent)); color: #fff; font-family: var(--mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; vertical-align: 1px; }
  .cell[disabled] { opacity: .45; cursor: not-allowed; }
  .mystat { max-width: 460px; margin: 18px auto 0; display: grid; gap: 12px; }
  .mystat h2 { font-size: 22px; margin: 6px 0 0; text-align: center; }
  .mycourse { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .my-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .my-top b { display: block; font-size: 16px; } .my-top span { color: var(--muted); font-size: 13px; }
  .my-pct { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .my-pct.hi { color: var(--ok); } .my-pct.mid { color: var(--warn); } .my-pct.lo { color: var(--err); }
  .pw-wrap { position: relative; display: block; }
  .pw-wrap .in { width: 100%; padding-right: 50px; }
  .pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 10px; }
  .pw-eye:hover { color: var(--text); background: var(--soft); }
  .ins-bar { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; }
  .ins-bar .f { flex: 0 1 320px; margin: 0; }
  .ins-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; margin: 0 0 18px; box-shadow: var(--shadow); }
  .ins-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
  .ins-h h2 { margin: 0; font-size: 20px; } .ins-h > span { color: var(--muted); font-size: 13.5px; }
  .ins-card .table-wrap { box-shadow: none; }
  .ins-card tr[data-grp], .ins-card tr[data-stu], .ins-card tr[data-team] { cursor: pointer; }
  .ins-card tr[data-grp]:hover td, .ins-card tr[data-stu]:hover td, .ins-card tr[data-team]:hover td { background: var(--soft); }
  .chart { width: 100%; height: auto; display: block; }
  .ch-grid { stroke: var(--line); stroke-width: 1; }
  .ch-ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .ch-ax { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
  @media (max-width: 640px) { .ch-ax { font-size: 10px; } .ins-card { padding: 16px; } }
  .ch-bar { fill: var(--accent); transition: opacity .15s; } .ch-bar.low { fill: var(--chart-low, var(--warn)); } .ch-bar.hot { opacity: .75; }
  :root[data-theme="light"] { --chart-low: #F59E0B; }
  .ch-none { fill: var(--line); }
  .chtip { position: fixed; z-index: 100; pointer-events: none; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .gstat.gs-risk b { color: var(--warn); }
  .meter { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; vertical-align: middle; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .meter.low i { background: var(--chart-low, var(--warn)); } .meter.grp i { background: var(--muted); }
  .mrow { display: inline-flex; align-items: center; gap: 10px; }
  .my-budget { margin: 0; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
  .my-budget.ok { background: var(--ok-bg); } .my-budget.warn { background: var(--warn-bg); } .my-budget.lo { background: var(--err-bg); }
  .my-cmp { display: grid; gap: 10px; }
  .cmp > span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .cmp-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; margin-top: 6px; font-size: 14px; }
  .cmp-row .meter { width: 100%; } .cmp-row small { color: var(--muted); }
  td.wc { cursor: pointer; user-select: none; transition: background-color .15s, box-shadow .15s; }
  td.wc:hover { background: var(--soft); }
  td.wc.on { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
  .wc-e { display: inline-block; min-width: 28px; text-align: center; color: var(--line); font-weight: 700; }
  td.wc:hover .wc-e { color: var(--muted); } td.wc.on .wc-e { color: var(--accent); }
  .wcol { border: 0; background: none; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 2px 4px; border-radius: 6px; white-space: nowrap; }
  .wcol:hover { background: var(--soft); color: var(--text); }
  .wrow { display: block; margin-top: 4px; border: 0; background: none; padding: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .wrow:hover { text-decoration: underline; }
  .wsel { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 43; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; box-shadow: 0 24px 60px -16px rgba(0,0,0,.6); max-width: calc(100vw - 120px); animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; } }
  .wsel .btn { padding: 10px 18px; }
  @media (max-width: 640px) { .wsel { left: 12px; right: 84px; transform: none; max-width: none; bottom: 14px; } }
  .ckcell { display: inline-grid; place-items: center; width: 40px; height: 36px; cursor: pointer; position: relative; }
  .ckcell input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .ckcell span { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); background: var(--card2); display: grid; place-items: center; transition: background-color .15s, border-color .15s, transform .15s; }
  .ckcell input:checked + span { background: var(--ok); border-color: var(--ok); }
  .ckcell input:checked + span::after { content: ""; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
  .ckcell:hover span { border-color: var(--ok); } .ckcell input:focus-visible + span { box-shadow: 0 0 0 3px var(--focus); outline: 2px solid var(--accent); }
  .ckcell input.dirty + span { box-shadow: 0 0 0 3px var(--warn-bg); } .ckcell input:disabled + span { opacity: .4; }
  .ckcell input:active + span { transform: scale(.9); }

  /* ----- look: a slow aurora behind the page, glass surfaces, a light that follows the mouse ----- */
  :root { --aur1: rgba(242,59,59,.24); --aur2: rgba(255,128,64,.13); --aur3: rgba(196,60,140,.15); --glass-line: rgba(255,255,255,.07); --glass-hi: rgba(255,255,255,.05); --grad2: #FF8A3D; }
  :root[data-theme="light"] { --aur1: rgba(220,38,38,.12); --aur2: rgba(255,140,90,.12); --aur3: rgba(200,90,170,.09); --glass-line: rgba(20,20,10,.08); --glass-hi: rgba(255,255,255,.75); --grad2: #EA580C; }
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  body::before { content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
    background: radial-gradient(38vmax 38vmax at 12% 18%, var(--aur1), transparent 62%), radial-gradient(32vmax 32vmax at 88% 8%, var(--aur2), transparent 62%), radial-gradient(44vmax 44vmax at 72% 92%, var(--aur3), transparent 62%);
    animation: aurora 26s ease-in-out infinite alternate; }

  .card, .panel, .letter, .gstat, .ccard, .mycourse, .dchip, .codebox, .acct-panel, .theme-btn, .seg, .cview {

  .ccard, .letter, .gstat:not(:first-child), .card, .signin, .panel.set, .mycourse, .dchip {
    background-image: radial-gradient(360px circle at var(--mx, -999px) var(--my, -999px), color-mix(in srgb, var(--accent) 14%, transparent), transparent 46%); }
  .ccard:hover, .letter:hover, .card:not(.add):hover, .dchip:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .card.add { background-color: transparent; box-shadow: none; }
  h1.brand::before { background-color: var(--accent); background-image: linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px), linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px), linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px), linear-gradient(135deg, var(--accent), var(--grad2)); }

  /* primary buttons: a warm gradient, a soft glow and a light sweep on hover */

    box-shadow: 0 10px 24px -12px color-mix(in srgb, var(--accent) 80%, transparent); }
  .btn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.32) 50%, transparent 70%); transform: translateX(-120%); transition: transform .75s cubic-bezier(.2,.7,.2,1); }

var qrcode = function() {

  /**

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;

    var _dataList = [];

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);

      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      }

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )

          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;

        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {

        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

          }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------

  /**

   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

  async function api(fn, ...args) {
    const [name, params] = RPC[fn];
    const body = {};
    params.forEach((p, i) => { if (args[i] !== undefined) body[p] = args[i]; });
    for (let tries = 0; tries < 3; tries++) {
      let res;
      try {
        res = await fetch(SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + name, {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
            /^eyJ/.test(SUPABASE_KEY) ? { Authorization: 'Bearer ' + SUPABASE_KEY } : {}),
          body: JSON.stringify(body)
        });
      } catch (e) { await new Promise(r => setTimeout(r, 700 * (tries + 1))); continue; }
      const text = await res.text();
      let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
      if (res.ok) return data;
      if (res.status >= 500 || res.status === 429) { await new Promise(r => setTimeout(r, 700 * (tries + 1))); continue; }
      const msg = (data && (data.message || data.error)) || 'Something went wrong (' + res.status + ').';
      if (msg === 'Please log in again.') { try { loggedOut(); } catch (e) {} }
      throw new Error(msg);
    }
    throw new Error('Could not reach the server. Check your internet.');
  }

    : '<input class="cell ' + cls + '" inputmode="decimal" autocomplete="off" data-max="' + it.max + '" value="' + esc(v) + '" ' + attrs + '>';
  const cellVal = (inp) => inp.type === 'checkbox' ? (inp.checked ? String(Number(inp.dataset.max)) : '') : inp.value.trim().replace(',', '.');
  const itemHead = (it) => '<th class="num">' + esc(it.item) + '<small>' + (it.check ? 'done = ' + it.max : (isBonus(it) ? 'extra, up to ' : 'out of ') + it.max) + '</small>' +

  /** The student next to their group: attendance and marks, and how many more weeks they can miss. */
  function myCompare(c) {

      : left === 0 ? '<p class="my-budget warn">Do not miss any more weeks. One more absence takes you below 75%.</p>'
      : '<p class="my-budget lo">You are below 75%. Talk to your TA.</p>';
    const bar = (label, you, them, max, fmt) => '<div class="cmp"><span>' + label + '</span><div class="cmp-row"><small>You</small><span class="meter"><i style="width:' + Math.round(100 * Math.min(1, (you || 0) / max)) + '%"></i></span><b>' + fmt(you) + '</b></div>' +
      '<div class="cmp-row"><small>Group</small><span class="meter grp"><i style="width:' + Math.round(100 * Math.min(1, (them || 0) / max)) + '%"></i></span><b>' + fmt(them) + '</b></div></div>';
    if (c.pct !== '' && A.pct != null) out.push(bar('Attendance', Number(c.pct), Number(A.pct), 1, v => Math.round(v * 100) + '%'));
    if (c.grade && c.grade.max && A.total != null) out.push(bar('Total marks', Number(c.grade.total), Number(A.total), c.grade.max, v => (Math.round(v * 10) / 10) + ' / ' + c.grade.max));
    return budget + (out.length ? '<div class="my-cmp">' + out.join('') + '<p class="note" style="margin:0">Group: the average of the ' + (A.n || '') + ' students in group ' + esc(c.group) + '.</p></div>' : '');

    return '<div class="my-grade"><div class="mg-head"><span>My marks</span><b>' + n(G.total) + '<small> / ' + max + '</small></b></div>' +

  /** Make any image a small square JPEG (256 px), cropped from the middle, ready to save. */
  function squarePhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
        c.width = c.height = 256;
        c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This file is not an image. Choose a JPG or PNG photo.')); };
      img.src = url;
    });
  }

  /** Admin, Courses tab: one course's grade distribution, with an Edit button that opens the Grade items dialog. */
  async function courseSettings(course, ci) {
    const box = $('cs' + ci);
    if (!box) return;
    let V;
    try { V = await api('gradesView', PIN, course, ''); } catch (e) { box.innerHTML = '<p class="err" style="padding:16px 0">' + esc(errMsg(e)) + '</p>'; return; }
    if (!$('cs' + ci)) return;
    const parts = (V.attendanceMax ? [{ item: 'Attendance', max: Number(V.attendanceMax), auto: true }] : []).concat(V.items.map(it => ({ item: it.item, max: Number(it.max), bonus: isBonus(it) })));
    const total = parts.reduce((t, x) => t + (x.bonus ? 0 : x.max), 0), extra = parts.reduce((t, x) => t + (x.bonus ? x.max : 0), 0);
    box.innerHTML = (parts.length
      ? '<div class="dbar">' + parts.map((x, i) => '<i class="d' + (i % 4) + '" style="flex:' + x.max + '" title="' + esc(x.item) + ': ' + x.max + '"></i>').join('') + '</div>' +
        '<div class="dist">' + parts.map((x, i) => '<div class="dchip"><span class="dot d' + (i % 4) + '"></span><b>' + x.max + '</b><span>' + esc(x.item) + (x.auto ? '<small>from attendance %</small>' : x.bonus ? '<small>extra, not in the total</small>' : '') + '</span></div>').join('') + '</div>'
      : '<p class="note" style="padding:16px 0 4px">No grades set for this course yet.</p>') +
      '<div class="dist-foot"><span>Total <b>' + total + '</b>' + (extra ? ' + ' + extra + ' bonus' : '') + '</span><button class="btn" type="button" id="ce' + ci + '">' + (parts.length ? 'Edit grades' : 'Set grades') + '</button></div>';
    $('ce' + ci).onclick = () => itemsDialog(course, V, () => courseSettings(course, ci));
  }
  /** End of term: one Excel file, one tab per course, one row per student with every week, attendance %, every grade and the total. */
  async function downloadFinal() {
    toast('Preparing the file');
    try {
      await loadXlsx();
      const data = await api('finalExport', PIN);
      if (!data.length) return toast('No students to export yet.');
      const wb = XLSX.utils.book_new(), used = {};
      data.forEach(c => {
        const head = ['Group', 'TA', 'Student Name', 'ID'].concat(c.weeks, ['Present', 'Absent', 'Excused', 'Attendance %'],
          c.attendanceMax ? ['Attendance (' + c.attendanceMax + ')'] : [], c.items.map(it => it.item + ' (' + it.max + ')'), ['Total']);
        const rows = c.rows.map(r => [r.group, r.ta, r.name, Number(r.id)].concat(r.weeks, [r.p, r.a, r.e, r.pct],
          c.attendanceMax ? [r.attGrade] : [], c.items.map(it => r.scores[it.key] === undefined ? '' : r.scores[it.key]), [r.total]));
        const ws = XLSX.utils.aoa_to_sheet([head].concat(rows));
        const pctCol = 4 + c.weeks.length + 3;
        for (let i = 1; i <= rows.length; i++) { const cell = ws[XLSX.utils.encode_cell({ r: i, c: pctCol })]; if (cell && cell.t === 'n') cell.z = '0%'; }
        ws['!cols'] = head.map((h, i) => ({ wch: i === 2 ? 42 : i === 3 ? 12 : Math.max(7, String(h).length + 2) }));
        let name = c.course.replace(/[\[\]*?\/\\:]/g, ' ').trim().slice(0, 31) || 'Course', k = 2;
        while (used[name]) name = name.slice(0, 27) + ' (' + (k++) + ')';
        used[name] = true;
        XLSX.utils.book_append_sheet(wb, ws, name);
      });
      XLSX.writeFile(wb, 'Tally Grades - Final attendance and grades.xlsx');
      toast('Downloaded: Tally Grades - Final attendance and grades.xlsx');
    } catch (e) { toast(errMsg(e)); }
  }
  /** Admin: every table in one Excel file (PINs are never included). */

      const data = await api('exportAll', PIN);
      const wb = XLSX.utils.book_new();
      Object.keys(data).forEach(k => {
        const rows = data[k] || [];
        const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['No data yet']]);
        XLSX.utils.book_append_sheet(wb, ws, k);
      });
      XLSX.writeFile(wb, 'Tally Grades - Backup ' + new Date().toISOString().slice(0, 10) + '.xlsx');
      toast('Backup downloaded.');
    } catch (e) { toast(errMsg(e)); }
  }

      BOT.toggle = toggle; BOT.ask = ask;

      $('botForm').onsubmit = (e) => { e.preventDefault(); ask(q.value); };

        if (!BOT || BOT.fab.hidden) return;

      /* voice: the browser's own speech recognition, free, Arabic (Egypt) */

  /* ----- Take attendance: the groups in front of you, one press to the QR ----- */

    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove();
    }
    toast(ok ? msg : 'Could not copy. Try again.');
  }

        const step = e.key === 'Enter' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        const col = [...$('rows').querySelectorAll('.cell[data-k="' + CSS.escape(inp.dataset.k) + '"]:not([disabled])')].filter(x => !x.closest('tr').hidden);
        const next = col[col.indexOf(inp) + step];
        if (next) { next.focus(); if (next.select) next.select(); }
      });
      status();
    }
    async function load() { try { V = await api('teamView', PIN, t.course, t.num); render(); } catch (e) { toast(errMsg(e)); } }
    $('save').onclick = async () => {
      const changes = Object.keys(dirty).map(k => { const [id, key] = k.split('|'); return { id: id, key: key, score: dirty[k] }; });
      $('save').disabled = true; $('save').textContent = 'Saving';
      try { V = await api('saveTeamScores', PIN, t.course, t.num, changes); Object.keys(dirty).forEach(k => delete dirty[k]); render(); toast('Saved for team ' + t.num + '.'); }
      catch (e) { toast(errMsg(e)); $('save').disabled = false; }
      $('save').textContent = 'Save';
    };
    load();
  }
  function itemsDialog(course, V, reload) {
    let rows = V.items.map(it => ({ key: it.key, item: it.item, max: it.max, check: !!it.check }));
    dialog('<span class="pill">' + esc(course) + '</span><h1 style="font-size:26px;margin-top:12px">Grade items</h1>' +
      '<p class="sub">These are the same for every group of this course. Renaming an item keeps its marks.</p>' +
      '<div class="form" style="margin-top:18px"><label class="f">Attendance is worth (marks, 0 for none)<input class="in" id="am" type="number" min="0" step="any" value="' + (V.attendanceMax || 0) + '"></label>' +
      '<div class="note">Items, in the same order as the course sheet. Tick <b>Done / not done</b> for an item you only mark as done (like an assignment): a tick gives the full mark.</div><div id="list" class="form" style="gap:10px"></div>' +
      '<div class="links" style="margin:0"><button class="link" id="aq" type="button">+ Quiz</button><button class="link" id="aa" type="button">+ Assignment</button><button class="link" id="amid" type="button">+ Midterm</button><button class="link" id="ao" type="button">+ Other</button></div>' +
      '<div class="err" id="er"></div><div class="row"><button class="btn" id="go" type="button">Save</button><button class="btn ghost" data-close type="button">Cancel</button></div></div>',
      (o, close) => {
        const q = (x) => o.querySelector(x);
        const sync = () => o.querySelectorAll('.item-row').forEach((el, i) => { rows[i].item = el.querySelector('.nm').value; rows[i].max = el.querySelector('.mx').value; rows[i].check = el.querySelector('.ckit').checked; });
        const draw = () => {
          q('#list').innerHTML = rows.length ? rows.map((r, i) => '<div class="item-row"><input class="in nm" placeholder="Name" value="' + esc(r.item) + '"><input class="in mx" type="number" min="0" step="any" placeholder="Full mark" value="' + esc(r.max) + '"><label class="ckit-l" title="Tick: you mark it Done or not done, and Done gives the full mark"><input type="checkbox" class="ckit"' + (r.check ? ' checked' : '') + '> Done / not done</label><button class="x" data-rm="' + i + '" type="button" aria-label="Remove">&times;</button></div>').join('') : '<p class="note">No items yet.</p>';
          o.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); rows.splice(Number(b.dataset.rm), 1); draw(); });
        };
        const add = (name, max, ck) => { sync(); rows.push({ key: '', item: name, max: max, check: !!ck }); draw(); const ins = o.querySelectorAll('.nm'); ins[ins.length - 1].focus(); };
        const count = (re) => rows.filter(r => re.test(r.item)).length;
        q('#aq').onclick = () => add('Q' + (count(/^Q\d+$/i) + 1), '');
        q('#aa').onclick = () => add('Assignment ' + (count(/^Assignment \d+$/i) + 1), '', true);
        q('#amid').onclick = () => add('Midterm', '');
        q('#ao').onclick = () => add('', '');
        draw();
        q('#go').onclick = async () => {
          sync(); q('#er').textContent = '';
          try { await api('saveItems', PIN, course, Number(q('#am').value), rows); close(); toast('Grade items saved.'); reload(); }
          catch (e) { q('#er').textContent = errMsg(e); }
        };
      });
  }

  startStaff();
})();
</script>
</body>
</html>
