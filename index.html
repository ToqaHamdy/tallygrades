<head>
<title>Tally Grades</title>
<base target="_top">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#F23B3B">
<script>
/* Vercel is the main address. The old GitHub Pages address checks that the Vercel site is up and is this app,
   then moves the visitor there with what this device remembers (student ID, phone ID, login, theme), keeping the same link.
   If the check fails, the old address simply keeps working. */
(function () {
  var PRIMARY = 'https://tallygrades.vercel.app', KEYS = ['att_id', 'att_name', 'att_groups', 'att_device', 'tg_token', 'tg_theme', 'tg_qmin', 'tg_qstrict'];
  try {
    var m = location.hash.match(/^#tgmove=([^&]*)(?:&to=(.*))?$/);
    if (m) {
      var d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
      KEYS.forEach(function (k) { if (d[k] != null && !localStorage.getItem(k)) localStorage.setItem(k, d[k]); });
      history.replaceState(null, '', location.pathname + location.search + (m[2] ? decodeURIComponent(m[2]) : ''));
    }
  } catch (e) {}
  if (!/\.github\.io$/i.test(location.hostname)) return;
  var ctl = window.AbortController ? new AbortController() : null;
  setTimeout(function () { if (ctl) ctl.abort(); }, 4000);
  fetch(PRIMARY + '/index.html?check=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) {
      if (t.indexOf('Made By: Toqa Hamdy') < 0 || t.indexOf('tgmove') < 0) return;
      var d = {}; KEYS.forEach(function (k) { try { var v = localStorage.getItem(k); if (v != null) d[k] = v; } catch (e) {} });
      var pack = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));
      location.replace(PRIMARY + '/' + location.search + '#tgmove=' + pack + (location.hash ? '&to=' + encodeURIComponent(location.hash) : ''));
    }).catch(function () {});
})();
try { if (localStorage.getItem('tg_theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>

<style>
  /* Dark is the default. Light is chosen with the switch in the footer and saved on this device. */
  :root {
    color-scheme: dark;
    --bg: #0F100E; --card: #171815; --card2: #20211D; --line: #2E302A; --text: #F2F3EC; --muted: #9C9E92; --dot: rgba(255,255,255,.055);
    --accent: #F23B3B; --on-accent: #FFFFFF; --ink: #FF6B61; --soft: rgba(242,59,59,.14); --focus: rgba(255,255,255,.09);
    --ok: #4ADE80; --ok-bg: rgba(74,222,128,.14); --warn: #FB923C; --warn-bg: rgba(251,146,60,.15); --err: #FF5A6E; --err-bg: rgba(255,90,110,.14);
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 18px 40px -24px rgba(0,0,0,.8);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
    /* older names, still used by a few inline styles */
    --purple: var(--accent); --purple2: var(--ink); --pill: var(--soft);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F4F2EC; --card: #FFFFFF; --card2: #F1EFE7; --line: #DEDACE; --text: #16170F; --muted: #6A6B60; --dot: rgba(0,0,0,.06);
    --accent: #DC2626; --on-accent: #FFFFFF; --ink: #B91C1C; --soft: rgba(220,38,38,.1); --focus: rgba(0,0,0,.07);
    --ok: #15803D; --ok-bg: rgba(21,128,61,.11); --warn: #C2410C; --warn-bg: rgba(194,65,12,.11); --err: #BE123C; --err-bg: rgba(190,18,60,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 18px 40px -26px rgba(40,40,20,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font); color: var(--text); font-size: 16px; line-height: 1.45; background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }
  a { color: var(--ink); }
  ::selection { background: var(--accent); color: var(--on-accent); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 40px 24px 24px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px 24px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--display); font-size: clamp(34px, 5vw, 58px); font-weight: 800; margin: 0; letter-spacing: -.035em; line-height: 1.02; }
  h1.brand { display: flex; align-items: center; gap: .28em; }
  h1.brand::before { content: ""; width: .62em; height: .62em; flex: none; border-radius: .14em; background:
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .14em 50% / .1em 52% no-repeat,
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .27em 50% / .1em 52% no-repeat,
    linear-gradient(90deg, var(--on-accent) 0 2px, transparent 2px) .40em 50% / .1em 52% no-repeat, var(--accent); }
  h2 { font-family: var(--display); letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 10px 0 0; font-size: 16px; max-width: 70ch; }
  .tabs { display: flex; gap: 4px 26px; flex-wrap: wrap; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 0 12px; margin-bottom: -1px; font-weight: 600; font-size: 15px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
  .grid > .card:not(.add):hover { border-color: var(--muted); transform: translateY(-2px); }
  .card h3 { font-family: var(--display); font-size: 25px; font-weight: 700; letter-spacing: -.02em; margin: 14px 0 6px; line-height: 1.15; }
  .card p { color: var(--muted); margin: 0 0 14px; font-size: 15px; line-height: 1.5; }
  .pill { display: inline-block; background: var(--soft); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 4px 9px; }
  .gta-src { margin-left: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; vertical-align: 2px; font-weight: 600; }
  .gwhen { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .q-g em.q-ta { color: var(--text); opacity: .75; }
  .pill.sched { margin-left: 6px; background: var(--card2); color: var(--text); }
  .pill.green { background: var(--ok-bg); color: var(--ok); margin-left: 6px; }
  .pill.green::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .links { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; }
  .link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .link.danger { color: var(--muted); }
  .link.danger:hover { color: var(--err); }
  .top .links .link { color: var(--text); opacity: .8; font-size: 14px; }
  .top .links .link:hover { opacity: 1; }
  .card[style*="--warn"] { border-color: var(--warn); }
  .card.add { border: 1.5px dashed var(--line); background: transparent; display: grid; place-items: center; align-content: center; gap: 10px; min-height: 190px; box-shadow: none; }
  .card.add:hover { border-color: var(--ink); }
  .card.add button { background: none; border: 0; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 20px; }

  /* landing: three rows, the whole row is the button */
  .doors { border-top: 2px solid var(--text); counter-reset: door; }
  .top:has(+ .doors) { border-bottom: 0; padding-bottom: 0; }
  .door { counter-increment: door; display: grid; grid-template-columns: 64px 1fr auto; grid-template-areas: "num title go" "num desc go"; gap: 6px 24px; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 30px 6px; color: inherit; transition: background .15s, padding .15s; }
  .door::before { content: "0" counter(door); grid-area: num; align-self: start; padding-top: 12px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .door .pill { display: none; }
  .door-t { grid-area: title; font-family: var(--display); font-size: clamp(32px, 4.5vw, 52px); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; transition: color .15s; }
  .door-d { grid-area: desc; color: var(--muted); font-size: 16px; max-width: 60ch; }
  .door-go { grid-area: go; font-size: 40px; color: var(--muted); transition: transform .2s, color .15s; }
  .door:hover { background: linear-gradient(90deg, var(--soft), transparent 70%); padding-left: 16px; }
  .door:hover .door-t, .door:hover .door-go { color: var(--ink); }
  .door:hover .door-go { transform: translateX(8px); }

  /* groups: one list per course */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
  .toolbar .filters { margin: 0; }
  .toolbar .acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .course { margin-bottom: 40px; }
  .course-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: 10px; }
  .course-head h2 { margin: 0; font-size: 28px; font-weight: 800; }
  .course-head span { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; margin-top: 18px; }
  .letter { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 18px 8px; box-shadow: var(--shadow); align-self: start; }
  .letter-head { display: flex; align-items: center; gap: 14px; padding: 12px 0 14px; border-bottom: 2px solid var(--accent); }
  .letter-big { width: 54px; height: 54px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--accent); color: var(--on-accent);
    font-family: var(--display); font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
  .letter-meta { font-family: var(--mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); line-height: 1.6; }
  .grow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .grow:last-child { border-bottom: 0; }
  .gcode { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .grow.is-live .gcode { color: var(--ink); }
  .gta { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gta.none { color: var(--muted); font-weight: 600; }
  .gta .pill.green { margin: 0; }
  .gmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .gbar { height: 3px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .gbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .grow .links, .grow .owner { grid-column: 2; margin: 6px 0 0; gap: 4px 12px; }
  .grow .link { font-size: 13px; white-space: nowrap; }
  .grow .owner { color: var(--muted); font-size: 13px; }
  .cset .dbar { display: flex; gap: 3px; height: 10px; margin: 18px 0 14px; border-radius: 6px; overflow: hidden; }
  .cset .dbar i { display: block; min-width: 6px; }
  .d0 { background: var(--accent); } .d1 { background: var(--warn); } .d2 { background: var(--ok); } .d3 { background: var(--muted); }
  .dist { display: flex; flex-wrap: wrap; gap: 10px; }
  .dchip { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 150px; }
  .dchip .dot { width: 10px; height: 10px; border-radius: 3px; grid-row: span 2; }
  .dchip b { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .dchip span:last-child { color: var(--muted); font-weight: 600; font-size: 14px; }
  .dchip small { display: block; font-size: 12px; font-weight: 500; }
  .dist-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-weight: 600; }
  .dist-foot b { font-family: var(--display); font-size: 24px; color: var(--text); margin-left: 6px; }
  .together { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; margin-top: 4px; border-top: 1px dashed var(--line); }
  .together > span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .together small { flex: 1 1 100%; color: var(--muted); font-size: 13px; }
  .tg-pick { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; background: var(--card2); }
  .tg-pick:has(input:checked) { border-color: var(--ink); background: var(--soft); }
  .tg-pick b { font-family: var(--display); font-size: 17px; }
  .obar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 22px; }
  .obar > span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-right: 4px; }
  .ochip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); text-decoration: none; max-width: 260px; }
  .ochip:hover { border-color: var(--muted); }
  .ochip.on { border-color: var(--ink); background: var(--soft); padding-right: 12px; }
  .ochip b { font-family: var(--display); font-size: 16px; }
  .ochip small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .odot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; animation: pulse 1.6s infinite; }
  .ox { background: none; border: 0; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 2px; }
  .ox:hover { color: var(--err); }
  a.link { cursor: pointer; }
  .newtab { font-size: 16px !important; padding: 0 2px !important; color: var(--muted) !important; }
  .newtab:hover { color: var(--ink) !important; text-decoration: none !important; }
  .tmchip { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; padding: 1px 7px; border-radius: 6px; font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, transparent); vertical-align: 1px; white-space: nowrap; }
  .tmchip small { font-family: var(--font); font-weight: 600; font-size: 11px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .letter.team .letter-head { border-bottom-color: var(--tc); }
  .letter.team .letter-big, .gbadge.team-badge { background: var(--tc); color: #fff; }
  .team-name { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; margin-bottom: 4px; }
  .teamrow td { background: color-mix(in srgb, var(--tc, var(--accent)) 10%, var(--card)) !important; }
  .teamrow .stn { color: var(--tc, var(--ink)); }
  .gtable tr.leader td { background: color-mix(in srgb, var(--tc, var(--accent)) 5%, var(--card)); }
  .lead { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; background: var(--tc, var(--accent)); color: #fff; font-family: var(--mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; vertical-align: 1px; }
  .cell[disabled] { opacity: .45; cursor: not-allowed; }
  .mystat { max-width: 460px; margin: 18px auto 0; display: grid; gap: 12px; }
  .mystat h2 { font-size: 22px; margin: 6px 0 0; text-align: center; }
  .mycourse { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .my-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .my-top b { display: block; font-size: 16px; } .my-top span { color: var(--muted); font-size: 13px; }
  .my-pct { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .my-pct.hi { color: var(--ok); } .my-pct.mid { color: var(--warn); } .my-pct.lo { color: var(--err); }
  .pw-wrap { position: relative; display: block; }
  .pw-wrap .in { width: 100%; padding-right: 50px; }
  .pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 10px; }
  .pw-eye:hover { color: var(--text); background: var(--soft); }
  .ins-bar { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; }
  .ins-bar .f { flex: 0 1 320px; margin: 0; }
  .ins-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; margin: 0 0 18px; box-shadow: var(--shadow); }
  .ins-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
  .ins-h h2 { margin: 0; font-size: 20px; } .ins-h > span { color: var(--muted); font-size: 13.5px; }
  .ins-card .table-wrap { box-shadow: none; }
  .ins-card tr[data-grp], .ins-card tr[data-stu], .ins-card tr[data-team] { cursor: pointer; }
  .ins-card tr[data-grp]:hover td, .ins-card tr[data-stu]:hover td, .ins-card tr[data-team]:hover td { background: var(--soft); }
  .chart { width: 100%; height: auto; display: block; }
  .ch-grid { stroke: var(--line); stroke-width: 1; }
  .ch-ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .ch-ax { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
  @media (max-width: 640px) { .ch-ax { font-size: 10px; } .ins-card { padding: 16px; } }
  .ch-bar { fill: var(--accent); transition: opacity .15s; } .ch-bar.low { fill: var(--chart-low, var(--warn)); } .ch-bar.hot { opacity: .75; }
  :root[data-theme="light"] { --chart-low: #F59E0B; }
  .ch-none { fill: var(--line); }
  .chtip { position: fixed; z-index: 100; pointer-events: none; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .gstat.gs-risk b { color: var(--warn); }
  .meter { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; vertical-align: middle; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .meter.low i { background: var(--chart-low, var(--warn)); } .meter.grp i { background: var(--muted); }
  .mrow { display: inline-flex; align-items: center; gap: 10px; }
  .my-budget { margin: 0; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
  .my-budget.ok { background: var(--ok-bg); } .my-budget.warn { background: var(--warn-bg); } .my-budget.lo { background: var(--err-bg); }
  .my-cmp { display: grid; gap: 10px; }
  .cmp > span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .cmp-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px; margin-top: 6px; font-size: 14px; }
  .cmp-row .meter { width: 100%; } .cmp-row small { color: var(--muted); }
  td.wc { cursor: pointer; user-select: none; transition: background-color .15s, box-shadow .15s; }
  td.wc:hover { background: var(--soft); }

  async function api(fn, ...args) {

  /** The student next to their group: attendance and marks, and how many more weeks they can miss. */
  function myCompare(c) {
    const A = c.groupAvg || {}, out = [];
    const left = 3 - c.a; /* 12 section weeks: 3 absences keep a student at 75% */
    /* the longest run of section weeks missed one after another (the midterm week does not break it) */
    let run = 0, best = 0, prev = -9; (c.missed || []).slice().sort((a, b) => a - b).forEach(w => { run = (w === prev + 1 || (prev === 6 && w === 8)) ? run + 1 : 1; best = Math.max(best, run); prev = w; });

    const budget = left > 0 ? '<p class="my-budget ok">You can miss <b>' + left + (left === 1 ? ' more week' : ' more weeks') + '</b> and stay at 75% or above.</p>'

  /** Make any image a small square JPEG (256 px), cropped from the middle, ready to save. */
  function squarePhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
        c.width = c.height = 256;
        c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This file is not an image. Choose a JPG or PNG photo.')); };
      img.src = url;
    });
  }

  function parseList(text) {
    const out = [], seen = {};
    for (const line of String(text).split(/\r?\n/)) {
      if (!line.trim()) continue;
      let cells = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/[,;]/)).map(x => x.trim()).filter(Boolean);
      let id = '', name = '';
      if (cells.length === 1) {
        const m = cells[0].match(/^(.*?)[\s\-:]+(\d{4,})$/) || cells[0].match(/^(\d{4,})[\s\-:]+(.*)$/);
        if (m) { if (/^\d+$/.test(m[1])) { id = m[1]; name = m[2]; } else { name = m[1]; id = m[2]; } }
      } else {
        const idCell = cells.find(x => /^\d{4,}(\.0+)?$/.test(x.replace(/\s/g, '')));
        if (idCell) {
          id = idCell.replace(/\s/g, '').replace(/\.0+$/, '');
          name = cells.filter(x => x !== idCell && !/^\d+$/.test(x)).sort((a, b) => b.length - a.length)[0] || '';
        }
      }
      if (id && name && !seen[id]) { seen[id] = 1; out.push([name.replace(/\s+/g, ' ').trim(), id]); }
    }
    return out;
  }

      for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) { d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1); } return d[a.length][b.length]; };

    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';

  }

        if (!step) return;
        e.preventDefault();
        const col = [...$('rows').querySelectorAll('.cell[data-k="' + CSS.escape(inp.dataset.k) + '"]:not([disabled])')].filter(x => !x.closest('tr').hidden);
        const next = col[col.indexOf(inp) + step];
        if (next) { next.focus(); if (next.select) next.select(); }
      });
      status();
    }
    async function load() { try { V = await api('teamView', PIN, t.course, t.num); const n = saver.restore(); render(); if (n) { toast(n + (n > 1 ? ' marks' : ' mark') + ' from last time were not saved. Saving them now.'); saver.kick(300); } } catch (e) { toast(errMsg(e)); } }
    $('save').onclick = () => saver.flush();
    load();
  }
  function itemsDialog(course, V, reload) {
    let rows = V.items.map(it => ({ key: it.key, item: it.item, max: it.max, check: !!it.check }));
    dialog('<span class="pill">' + esc(course) + '</span><h1 style="font-size:26px;margin-top:12px">Grade items</h1>' +
      '<p class="sub">These are the same for every group of this course. Renaming an item keeps its marks.</p>' +
      '<div class="form" style="margin-top:18px"><label class="f">Attendance is worth (marks, 0 for none)<input class="in" id="am" type="number" min="0" step="any" value="' + (V.attendanceMax || 0) + '"></label>' +
      '<div class="note">Items, in the same order as the course sheet. Tick <b>Done / not done</b> for an item you only mark as done (like an assignment): a tick gives the full mark.</div><div id="list" class="form" style="gap:10px"></div>' +
      '<div class="links" style="margin:0"><button class="link" id="aq" type="button">+ Quiz</button><button class="link" id="aa" type="button">+ Assignment</button><button class="link" id="amid" type="button">+ Midterm</button><button class="link" id="ao" type="button">+ Other</button></div>' +
      '<div class="err" id="er"></div><div class="row"><button class="btn" id="go" type="button">Save</button><button class="btn ghost" data-close type="button">Cancel</button></div></div>',
      (o, close) => {
        const q = (x) => o.querySelector(x);
        const sync = () => o.querySelectorAll('.item-row').forEach((el, i) => { rows[i].item = el.querySelector('.nm').value; rows[i].max = el.querySelector('.mx').value; rows[i].check = el.querySelector('.ckit').checked; });
        const draw = () => {
          q('#list').innerHTML = rows.length ? rows.map((r, i) => '<div class="item-row"><input class="in nm" placeholder="Name" value="' + esc(r.item) + '"><input class="in mx" type="number" min="0" step="any" placeholder="Full mark" value="' + esc(r.max) + '"><label class="ckit-l" title="Tick: you mark it Done or not done, and Done gives the full mark"><input type="checkbox" class="ckit"' + (r.check ? ' checked' : '') + '> Done / not done</label><button class="x" data-rm="' + i + '" type="button" aria-label="Remove">&times;</button></div>').join('') : '<p class="note">No items yet.</p>';
          o.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); rows.splice(Number(b.dataset.rm), 1); draw(); });
        };
        const add = (name, max, ck) => { sync(); rows.push({ key: '', item: name, max: max, check: !!ck }); draw(); const ins = o.querySelectorAll('.nm'); ins[ins.length - 1].focus(); };
        const count = (re) => rows.filter(r => re.test(r.item)).length;
        q('#aq').onclick = () => add('Q' + (count(/^Q\d+$/i) + 1), '');
        q('#aa').onclick = () => add('Assignment ' + (count(/^Assignment \d+$/i) + 1), '', true);
        q('#amid').onclick = () => add('Midterm', '');
        q('#ao').onclick = () => add('', '');
        draw();
        q('#go').onclick = async () => {
          sync(); q('#er').textContent = '';
          try { await api('saveItems', PIN, course, Number(q('#am').value), rows); close(); toast('Grade items saved.'); reload(); }
          catch (e) { q('#er').textContent = errMsg(e); }
        };
      });
  }

  startStaff();
})();
</script>
</body>
</html>
